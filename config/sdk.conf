# ==============================================================================
# RK3528 SDK 构建配置
# ------------------------------------------------------------------------------
# 支持平台：原生 Ubuntu 20.04/22.04/24.04 x86_64 与 Win11 WSL2 中的 Ubuntu 22.04/24.04。
# WSL2 用户请改用 sdk.wsl.conf.example（工作区必须落在 WSL 原生 ext4，不能是 /mnt/*）。
# ------------------------------------------------------------------------------
# 不要直接修改本文件来定制本机环境，推荐做法：
#   1) cp config/sdk.conf config/sdk.local.conf
#   2) 编辑 config/sdk.local.conf
#   3) export RK_CONF=/path/to/sdk.local.conf   或   RK_CONF=... ./rk3528-sdk.sh xxx
# 也可以直接用同名环境变量覆盖任意一项，例如：
#   RK_WORKSPACE=/mnt/bigdisk/rk3528 RK_JOBS=8 ./rk3528-sdk.sh fw-build all
#
# 所有变量统一使用 RK_ 前缀。带 (env) 标记的是脚本内部派生/只读变量。
# ==============================================================================

# ------------------------------------------------------------------------------
# 目录布局（源码体积大，建议把 RK_WORKSPACE / RK_DOWNLOAD_DIR 放到大容量磁盘）
# ------------------------------------------------------------------------------
# RK_ROOT 由 lib/config.sh 自动推导为本仓库根目录。
RK_WORKSPACE="${RK_WORKSPACE:-${RK_ROOT}/workspace}"
RK_DOWNLOAD_DIR="${RK_DOWNLOAD_DIR:-${RK_ROOT}/downloads}"
RK_OUTPUT_DIR="${RK_OUTPUT_DIR:-${RK_ROOT}/out}"
RK_LOG_DIR="${RK_LOG_DIR:-${RK_ROOT}/logs}"

# ------------------------------------------------------------------------------
# 主机与交叉编译工具链
# ------------------------------------------------------------------------------
RK_TOOLCHAIN_VERSION="${RK_TOOLCHAIN_VERSION:-11.3-aarch64}"
RK_TOOLCHAIN_ROOT="${RK_TOOLCHAIN_ROOT:-/opt/FriendlyARM/toolchain}"
RK_CROSS_COMPILE="${RK_CROSS_COMPILE:-aarch64-linux-gnu-}"
# 并行编译线程数，0 表示自动取 nproc
RK_JOBS="${RK_JOBS:-0}"
# 至少需要多少 GB 空闲空间才允许开始全量编译（FriendlyWrt 全量约需 50G+）
RK_MIN_FREE_GB="${RK_MIN_FREE_GB:-50}"
# 置 1 只打印将要执行的命令，不真正执行（预演模式）
RK_DRY_RUN="${RK_DRY_RUN:-0}"
# 置 1 跳过所有交互确认（用于 CI；危险操作仍需显式 --yes）
RK_ASSUME_YES="${RK_ASSUME_YES:-0}"
# 置 y 让 sd-fuse 不询问安装依赖/下载镜像
RK_SDFUSE_NONINTERACTIVE="${RK_SDFUSE_NONINTERACTIVE:-y}"
# GitHub 访问不便时可填写镜像前缀，例如 https://ghproxy.net/https://github.com
RK_GITHUB_MIRROR="${RK_GITHUB_MIRROR:-}"
# raw.githubusercontent.com 镜像前缀，例如 https://ghproxy.net/
RK_RAW_MIRROR="${RK_RAW_MIRROR:-}"

# ------------------------------------------------------------------------------
# 目标板 / 目标系统
# ------------------------------------------------------------------------------
# 默认 OS 目录名（必须与 sd-fuse 内定义严格一致，不可随意改名）
RK_DEFAULT_OS="${RK_DEFAULT_OS:-ubuntu-noble-core-arm64}"
# sd-fuse_rk3528 kernel-6.1.y 分支支持的全部 OS 目录名
RK_SDFUSE_OS_LIST="${RK_SDFUSE_OS_LIST:-debian-trixie-core-arm64 ubuntu-noble-core-arm64 debian-bullseye-desktop-arm64 debian-bullseye-minimal-arm64 buildroot friendlywrt24 friendlywrt24-docker friendlywrt25 friendlywrt25-docker proxmox-arm64 eflasher alpine-linux-arm64 openmediavault-arm64}"
# Wiki「其他Linux系统编译」章节明确适用的 OS（内核 v6.1.y / u-boot v2017.09）
RK_WIKI_OS_LIST="${RK_WIKI_OS_LIST:-friendlywrt25 friendlywrt25-docker ubuntu-noble-core-arm64 openmediavault-arm64 debian-trixie-core-arm64}"

# ------------------------------------------------------------------------------
# FriendlyWrt 25.12（repo 多仓库工程）
# ------------------------------------------------------------------------------
RK_REPO_TOOL_URL="${RK_REPO_TOOL_URL:-https://github.com/friendlyarm/repo}"
RK_FW_MANIFEST_URL="${RK_FW_MANIFEST_URL:-https://github.com/friendlyarm/friendlywrt_manifests}"
RK_FW_MANIFEST_BRANCH="${RK_FW_MANIFEST_BRANCH:-master-v25.12}"
RK_FW_MANIFEST_FILE="${RK_FW_MANIFEST_FILE:-rk3528.xml}"
RK_FW_BOARD_MK="${RK_FW_BOARD_MK:-rk3528.mk}"
RK_FW_BOARD_MK_DOCKER="${RK_FW_BOARD_MK_DOCKER:-rk3528-docker.mk}"
# repo sync 并发数
RK_REPO_JOBS="${RK_REPO_JOBS:-4}"

# ------------------------------------------------------------------------------
# 源码仓库与分支
# ------------------------------------------------------------------------------
RK_KERNEL_REPO="${RK_KERNEL_REPO:-https://github.com/friendlyarm/kernel-rockchip}"
RK_KERNEL_BRANCH="${RK_KERNEL_BRANCH:-nanopi6-v6.1.y}"
RK_KERNEL_DEFCONFIG="${RK_KERNEL_DEFCONFIG:-nanopi5_linux_defconfig}"
RK_KERNEL_EXTRA_CONFIG="${RK_KERNEL_EXTRA_CONFIG:-friendlywrt.config}"

RK_UBOOT_REPO="${RK_UBOOT_REPO:-https://github.com/friendlyarm/uboot-rockchip}"
RK_UBOOT_BRANCH="${RK_UBOOT_BRANCH:-nanopi5-v2017.09}"
RK_UBOOT_BOARD="${RK_UBOOT_BOARD:-nanopi_r3}"
# 手工编译时 Wiki 使用 friendlyelec 分支；repo 工程 manifest 使用 nanopi5 分支
RK_RKBIN_REPO="${RK_RKBIN_REPO:-https://github.com/friendlyarm/rkbin}"
RK_RKBIN_BRANCH="${RK_RKBIN_BRANCH:-friendlyelec}"

RK_SDFUSE_REPO="${RK_SDFUSE_REPO:-https://github.com/friendlyarm/sd-fuse_rk3528}"
RK_SDFUSE_BRANCH="${RK_SDFUSE_BRANCH:-kernel-6.1.y}"
RK_PREBUILTS_REPO="${RK_PREBUILTS_REPO:-https://github.com/friendlyarm/prebuilts}"
RK_PREBUILTS_BRANCH="${RK_PREBUILTS_BRANCH:-master}"

# ------------------------------------------------------------------------------
# 路线 D：ZTE W132D 主线 Linux（独立上游，与 FriendlyELEC BSP 不共用任何源码）
# ------------------------------------------------------------------------------
RK_W132D_REPO="${RK_W132D_REPO:-https://github.com/zte-cloud-computer/w132d-linux-mainline}"
RK_W132D_BRANCH="${RK_W132D_BRANCH:-main}"
# Release 资产走 latest 重定向，无需解析 tag；也可用 --tag 指定固定版本
RK_W132D_RELEASE_BASE="${RK_W132D_RELEASE_BASE:-https://github.com/zte-cloud-computer/w132d-linux-mainline/releases/download}"
RK_W132D_RELEASE_LATEST="${RK_W132D_RELEASE_LATEST:-https://github.com/zte-cloud-computer/w132d-linux-mainline/releases/latest/download}"
RK_W132D_RELEASES_API="${RK_W132D_RELEASES_API:-https://api.github.com/repos/zte-cloud-computer/w132d-linux-mainline/releases/latest}"
# 完整 Armbian 镜像构建至少需要 35 GiB（上游 build.md）
RK_W132D_MIN_FREE_GB="${RK_W132D_MIN_FREE_GB:-35}"
# 构建要求 Python 3.12+；刷写脚本要求 3.9+
RK_W132D_PYTHON_BUILD_MIN="${RK_W132D_PYTHON_BUILD_MIN:-3.12}"
RK_W132D_PYTHON_FLASH_MIN="${RK_W132D_PYTHON_FLASH_MIN:-3.9}"

# ------------------------------------------------------------------------------
# 下载源
# ------------------------------------------------------------------------------
RK_IMAGES_BASE_URL="${RK_IMAGES_BASE_URL:-https://downloads.friendlyelec.com/os-images/rk3528/images}"
RK_ROOTFS_BASE_URL="${RK_ROOTFS_BASE_URL:-https://downloads.friendlyelec.com/rootfs/rk3528}"
RK_RAW_BASE_URL="${RK_RAW_BASE_URL:-https://raw.githubusercontent.com/friendlyarm/sd-fuse_rk3528/kernel-6.1.y}"
# 下载失败重试次数
RK_DOWNLOAD_RETRIES="${RK_DOWNLOAD_RETRIES:-3}"
