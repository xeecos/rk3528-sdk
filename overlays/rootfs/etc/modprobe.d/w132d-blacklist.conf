# W132D 板级模块黑名单
#
# 以下模块在 W132D 上探测时会访问 GPIO 或依赖不存在的硬件，
# 直接导致内核 oops（往往表现为 CPU 挂起后 RCU stall）。
#
# 说明：`install xxx /bin/true` 比 `blacklist xxx` 更彻底 ——
# blacklist 只影响热插拔自动加载，install 规则会让 modprobe 直接执行
# /bin/true，模块无论何种方式都无法加载。
#
# 注意：Wi-Fi 驱动（sprdwl_ng / uwe5622_bsp_sdio / sprdbt_tty）不要加进本文件，
# 它们在补上 vqmmc-supply 与 clk_ignore_unused 后可正常工作。

# 红外接收：probe 时直接读写 GPIO
install gpio_ir_recv /bin/true
blacklist gpio_ir_recv

# 音频子系统：probe 时访问 GPIO（部分用于功放使能脚）
install snd_soc_simple_card /bin/true
install snd_soc_simple_card_utils /bin/true
install snd_soc_rockchip_pdm /bin/true
install snd_soc_rockchip_sai /bin/true
install snd_soc_rk3528 /bin/true
install snd_soc_es7202 /bin/true
blacklist snd_soc_simple_card
blacklist snd_soc_simple_card_utils
blacklist snd_soc_rockchip_pdm
blacklist snd_soc_rockchip_sai
blacklist snd_soc_rk3528
blacklist snd_soc_es7202
